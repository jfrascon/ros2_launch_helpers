# ==============================================================================
# Ruff configuration (formatter + linter)
# ==============================================================================
# This section configures Ruff, a high-performance Python linter and formatter.
# All settings related to how Ruff analyzes and formats your code go under this table.
[tool.ruff]
line-length = 100
# Treat modules below the repository root and its "src" directory as first-party.
# These are Ruff's default source roots, declared explicitly for clarity.
src = [".", "src"]

[tool.ruff.format]
# Use single quotes for ordinary strings
quote-style = "single"
# Keep classic 4-space indentation (alternatives: "tab")
indent-style = "space"
# Disable Black’s “magic trailing comma” auto-wrapping behaviour
skip-magic-trailing-comma = true
# Always write LF line endings, regardless of the OS that runs the formatter
line-ending = "lf"

# The 'lint' table configures the linting (static code analysis) behavior.
[tool.ruff.lint]

# 'select' specifies an explicit list of rule codes/prefixes to enable. Ruff will only
# check for rules in this list, ignoring all others. This provides a clear,
# defined set of standards for the project.
#
# The selected rule sets are:
# - B: flake8-bugbear rules detect likely bugs and error-prone practices.
# - C4: flake8-comprehensions rules simplify unnecessary comprehensions.
# - E: pycodestyle errors detect important PEP 8 violations.
# - F: Pyflakes rules detect undefined names, unused imports, and related errors.
# - I: Ruff's isort-compatible rules organize imports.
# - Q: flake8-quotes rules enforce the quote policy configured below.
# - W: pycodestyle warnings detect less severe PEP 8 violations.
#
# UP is not selected. It needs an explicit minimum Python target before syntax can be modernized.
select = ["B", "C4", "E", "F", "I", "Q", "W"]

# Ignore PEP 8 slice-spacing clash with Black (still flagged by pycodestyle)
extend-ignore = ["E203"]

# This section allows for fine-tuning the behavior of specific rule sets
# that were enabled in the 'select' list above.
# Configuration for the 'flake8-quotes' rules (which have the prefix "Q").
[tool.ruff.lint.flake8-quotes]

# Enforces the use of single quotes for all inline strings (strings that do not
# span multiple lines). When the code is formatted or fixed (e.g., on save),
# Ruff will automatically convert "double-quoted strings" to 'single-quoted strings'.
# Possible values: "single", "double".
inline-quotes = "single"

# Enforces the use of double quotes for docstrings (e.g., """My Docstring""").
# This is the recommended convention according to PEP 257 (Docstring Conventions)
# and is a common, strongly-held practice in the Python community.
# Possible values: "single", "double".
docstring-quotes = "double"

# Use triple double quotes for multiline strings so the formatter and linter agree.
multiline-quotes = "double"
# Keep the other quote style when it avoids inserting a backslash escape.
avoid-escape = true

[tool.ruff.lint.isort]
# Match Ruff's import ordering to the Google style enforced by ament_flake8.
# Sort imports by module name without prioritizing import statements over from statements.
force-sort-within-sections = true
# Place external dependencies before first-party imports, as required by the Google style.
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
# Sort imported names alphabetically instead of grouping names by capitalization.
order-by-type = false
split-on-trailing-comma = false
# Set this when you want specific import sections to stay adjacent instead of separated by
# blank lines.
# Common values: "future", "standard-library", "third-party", "first-party", "local-folder".
no-lines-before = []

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
